# docker compose up                  -> API on :8000 + Postgres on :5432
# docker compose --profile web up    -> also the Next.js console on :3000
services:
  db:
    image: pgvector/pgvector:pg16      # plain Postgres today; pgvector ready for benefit-doc RAG
    environment:
      POSTGRES_USER: member
      POSTGRES_PASSWORD: member           # local-only; on AWS this comes from Secrets Manager
      POSTGRES_DB: member
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U member -d member"]
      interval: 2s
      retries: 15

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://member:member@db:5432/member
      CORS_ORIGINS: http://localhost:3000
    env_file: [{ path: .env, required: false }]
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: [web]
    build:
      context: ./web
      args:   # inlined into the browser bundle at build time, so a build arg, not runtime env
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
